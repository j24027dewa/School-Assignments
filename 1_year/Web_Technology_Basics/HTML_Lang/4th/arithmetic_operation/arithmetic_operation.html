<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>演算子</title>
    </head>
    <body>
        <script language="javascript" type="text/javascript">
            var num1 = 20, num2 = 3;
            document.write("<p> num1+num2=" + (num1 + num2) + "</p>");
            document.write("<p> num1-num2=" + (num1 - num2) + "</p>");
            document.write("<p> num1*num2=" + (num1 * num2) + "</p>");
            document.write("<p> num1/num2=" + (num1 / num2) + "</p>");
            document.write("<p> num1%num2=" + (num1 % num2) + "</p>");
        </script>
    </body>
</html>
