<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>課題４ 箇条書き</title>
    </head>
    <body>
        <h1>リスト表記</h1>
        <b>きょうのかいもの</b>
        <ul>
            <li>とりにく</li>
            <li>たまご</li>
            <li>たまねぎ</li>
        </ul>
        <br />
        <b>お弁当ランキング</b>
        <ol>
            <li>ハンバーグ</li>
            <li>たまごやき</li>
            <li>ウインナー</li>
            <li>やきにく</li>
        </ol>
        <br />
        <b>TCP/IPの階層構造</b>
        <dl>
            <dt>アプリケーション層</dt>
            <dd>ユーザプロセス間の通信</dd>
            <dt>トランスポート層</dt>
            <dd>コンピュータ間の通信</dd>
            <dt>インターネット層</dt>
            <dd>異なるインターネット間の通信</dd>
            <dt>ネットワークインターフェース層</dt>
            <dd>物理的な通信</dd>
        </dl>
    </body>
</html>
