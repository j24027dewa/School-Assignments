<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>変数とデータ型</title>
    </head>
    <body>
        <script language="JavaScript" type="text/javascript">
            var name = "Teikyo Univercity";
            var inum = 20;
            var dnum = 20.5;
            var bool = true;
            var n = null;
            var undef;
            document.write("<p>" + name + "</p>");
            document.write("<p>" + inum + "</p>");
            document.write("<p>" + dnum + "</p>");
            document.write("<p>" + bool + "</p>");
            document.write("<p>" + n + "</p>");
            document.write("<p>" + undef + "</p>");
        </script>
    </body>
</html>
